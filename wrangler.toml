name = "streetball-store"
main = "worker/index.js"
compatibility_date = "2026-07-01"
workers_dev = true

# Os dois nomes usam o mesmo Worker e banco. A zona precisa estar ativa no Cloudflare.
routes = [
  { pattern = "lojastreetball.com.br", custom_domain = true },
  { pattern = "www.lojastreetball.com.br", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/account.html", "/conta", "/criar-conta", "/pedidos"]

# Banco D1 ja criado no Cloudflare para a Streetball Store
[[d1_databases]]
binding = "DB"
database_name = "streetball-db"
database_id = "72f1d273-c678-485c-9ec1-237453a01bd9"

[triggers]
crons = ["0 * * * *"]

[vars]
ASAAS_SANDBOX = "true"
SALES_ENABLED = "true"
PAYMENTS_PRODUCTION_ENABLED = "false"
# Opção B: destinatário paga eventuais tributos de importação e Despacho Postal
# nos canais oficiais. Manter produção BLOQUEADA até revisão fiscal e da informação ao comprador.
CUSTOMER_PAYS_IMPORT_TAXES = "true"
IMPORT_TAX_DISCLOSURE_APPROVED = "false"
IMPORT_COMPLIANCE_APPROVED = "false"
WA_AUTOMATION_ENABLED = "false"
WA_TRANSPORT = "local"
WA_LOCAL_ORDERS_ENABLED = "false"
# Dominio HTTPS da vitrine usado somente para montar URLs publicas das fotos na previa.
STORE_PUBLIC_URL = "https://lojastreetball.com.br"
# Valor TEMPORARIO apenas para simular cobranças no Sandbox. Nao habilitar producao com este frete.
SHIPPING_FLAT_BRL = "0.00"
# Catálogo compartilhado: números autorizados são cadastrados no painel /suppliers.html
# e guardados no D1. A ordem de cadastro define a prioridade de consulta.
# Nunca informe números de fornecedores em arquivo público.
# Depois de simular custo de entrega, definir frete: exemplo SHIPPING_FLAT_BRL = "19.90"
# Não habilite checkout sem validar imposto de importação e prazos reais.

# Segredos necessários (NUNCA escreva as chaves neste arquivo):
# Sandbox atual: ASAAS_API_KEY, ASAAS_WEBHOOK_TOKEN (ou ASAAS_SANDBOX_API_KEY, ASAAS_SANDBOX_WEBHOOK_TOKEN)
# Produção: ASAAS_PRODUCTION_API_KEY, ASAAS_PRODUCTION_WEBHOOK_TOKEN
# ADMIN_TOKEN
# WA_TOKEN, WA_APP_SECRET, WA_VERIFY_TOKEN, WA_PHONE_NUMBER_ID
# SUPPLIERS_JSON (até 5 fornecedores), BUYER_WA_TEMPLATE,
# SUPPLIER_WA_TEMPLATE_MEDIA, OWNER_WA_PHONE, OWNER_WA_TEMPLATE
# BUYER_DELAY_WA_TEMPLATE: nome do template de desculpas aprovado pela Meta.
# Prazo: 12h por fornecedor e 72h no total (constantes no backend).
# Configuração e implantação: worker/SETUP.md
