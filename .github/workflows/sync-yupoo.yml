name: Importar catálogo James Jersey
on:
  push:
    paths:
      - '.github/workflows/sync-yupoo.yml'
  schedule:
    - cron: '15 12 * * *'  # em geral 09:15 BRT; GitHub pode atrasar
  workflow_dispatch:
    inputs:
      max_albums:
        description: 'Quantidade de galerias de fotos por execução (0 = todas, cuidado com timeout)'
        required: true
        default: '100'
      index_only:
        description: 'Somente cadastrar álbuns (true/false)'
        required: true
        default: 'false'
permissions:
  contents: write
concurrency:
  group: streetball-catalog
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar navegador
        run: |
          python -m pip install --disable-pip-version-check playwright beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Indexar as 94 páginas e importar galerias públicas pendentes
        env:
          ALBUM_LIMIT: ${{ github.event.inputs.max_albums || '100' }}
          INDEX_ONLY: ${{ github.event.inputs.index_only || 'false' }}
          JAMES_IMAGES_AUTHORIZED: ${{ vars.JAMES_IMAGES_AUTHORIZED }}
        run: |
          if [ "$JAMES_IMAGES_AUTHORIZED" != 'true' ]; then
            echo 'Autorizacao pendente: indexacao de metadados sem publicar fotos ou novos produtos.'
            python scripts/import_yupoo.py --max-pages 94 --refresh-index --index-only --stage-only
          elif [ "$INDEX_ONLY" = true ]; then
            python scripts/import_yupoo.py --max-pages 94 --refresh-index --index-only
          else
            python scripts/import_yupoo.py --max-pages 94 --refresh-index --max-albums "$ALBUM_LIMIT" --scroll-steps 2 --pause 1.5
          fi
      - name: Salvar catálogo e ponto de retomada
        if: always()
        run: |
          git config user.name 'Streetball Catalog Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/catalog.json public/catalog.js scripts/yupoo_album_index.json scripts/yupoo_import_checkpoint.json
          if ! git diff --cached --quiet; then
            git commit -m 'Sincronizar álbuns Yupoo [automático]'
            git push
          fi
