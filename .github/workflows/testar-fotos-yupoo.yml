name: Guardar capas James Jersey na loja
on:
  push:
    paths:
      - '.github/workflows/testar-fotos-yupoo.yml'
  schedule:
    - cron: '17 * * * *' # lote a cada hora; horarios aproximados UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximo de capas por lote (1 a 500)'
        required: false
        default: '500'
permissions:
  contents: write
concurrency:
  group: streetball-catalog
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Carregar catalogo atualizado
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar biblioteca de imagens
        run: python -m pip install --disable-pip-version-check pillow
      - name: Baixar e validar capas reais do fornecedor
        env:
          IMAGE_LIMIT: ${{ github.event.inputs.limit || '500' }}
        run: |
          python scripts/cache_yupoo_covers.py --limit "$IMAGE_LIMIT" --workers 5
      - name: Publicar fotos e salvar progresso (com tentativa apos commits simultaneos)
        if: always()
        run: |
          git config user.name 'Streetball Image Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/catalog.json public/catalog.js public/images/yupoo scripts/yupoo_image_probe.json scripts/yupoo_cover_failures.json
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao neste lote.'
            exit 0
          fi
          git commit -m 'Importar e otimizar capas do James Jersey [automatico]'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo 'Conflito no catalogo: interrompendo sem substituir edicoes.'
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'Lote publicado no repositorio.'
              exit 0
            fi
            sleep 4
          done
          echo 'Nao foi possivel enviar as fotos sem conflito.'
          exit 1
